[tox]
envlist = docs,py3,pep8
skipsdist = True
sitepackages = False
skip_missing_interpreters = False

[testenv]
basepython = python3
usedevelop = True
setenv =
  VIRTUAL_ENV={envdir}
install_command = pip install -U {opts} {packages}
deps = -r{toxinidir}/requirements.txt
allowlist_externals =
  find
commands =
  find . -type f -name "*.py[c|o]" -delete
  stestr run --no-subunit-trace {posargs}
  stestr slowest

[testenv:venv]
basepython = python3
commands = {posargs}

[testenv:docs]
basepython = python3
commands =
  sphinx-build -b html -W doc/source doc/build/html

[testenv:pep8]
basepython = python3
usedevelop = False
deps = -r{toxinidir}/test-requirements.txt
commands =
  flake8 {posargs}

[flake8]
ignore = E128
exclude = .venv,.git,.tox,doc,.eggs

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - py3
          - pep8
          - docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: pip install tox
      - name: Run tox -e ${{ matrix.env }}
        run: tox -e ${{ matrix.env }}
